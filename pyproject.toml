[project]
name = "centaur-eval"
version = "0.1.0"
description = "Evaluation harness for a proactive Slack assistant (act / ask / notify / silent)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.50",
]

[project.scripts]
centaur-eval = "centaur_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centaur_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
